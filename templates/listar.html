{% extends "base.html" %}
{% block contenido %}
<h2>Listado de productos</h2>

<form method="get" action="{{ url_for('productos.buscar') }}">
  <p><label for="q">Buscar:</label>
  <input id="q" name="q" value="{{ termino or '' }}" placeholder="Buscar...">
  <button type="submit">Buscar</button></p>
</form>

<p><a href="{{ url_for('productos.crear') }}">+ Nuevo producto</a></p>

<table border="1" cellpadding="6">
  <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
  {% for p in productos %}
  <tr>
    <td>{{ p.id }}</td>
    <td>{{ p.nombre }}</td>
    <td>${{ "%.2f"|format(p.precio) }}</td>
    <td>{{ p.stock }}</td>
    <td>
      <a href="{{ url_for('productos.editar', producto_id=p.id) }}">Editar</a>
      <form method="post" action="{{ url_for('productos.eliminar', producto_id=p.id) }}"
            style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Eliminar</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="5">No hay productos para mostrar.</td></tr>
  {% endfor %}
</table>
{% endblock %}
