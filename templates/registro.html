{% extends "base.html" %}
{% block contenido %}
<h2>Registro de usuario</h2>
<form method="post">
  <p><label>Usuario: <input name="usuario"></label></p>
  <p><label>Clave: <input type="password" name="clave"></label></p>
  <p><button type="submit">Registrarme</button></p>
</form>
<p><a href="{{ url_for('auth.login') }}">¿Ya tienes cuenta? Inicia sesión</a></p>
{% endblock %}
