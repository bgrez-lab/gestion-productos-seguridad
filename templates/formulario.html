{% extends "base.html" %}
{% block contenido %}
<h2>{{ "Editar producto" if producto else "Nuevo producto" }}</h2>
<form method="post">
  <p><label>Nombre: <input name="nombre" value="{{ producto.nombre if producto else '' }}"></label></p>
  <p><label>Precio: <input name="precio" value="{{ producto.precio if producto else '' }}"></label></p>
  <p><label>Stock: <input name="stock" value="{{ producto.stock if producto else '' }}"></label></p>
  <p><button type="submit">Guardar</button></p>
</form>
<p><a href="{{ url_for('productos.listar') }}">Volver</a></p>
{% endblock %}
