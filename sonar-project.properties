# Configuración de SonarCloud para el análisis del proyecto.

# Definición del proyecto en SonarCloud: <organización>_<repositorio>.
# Ajusta "bgrez-lab" si en SonarCloud tu organización quedó con otro nombre.
sonar.projectKey=bgrez-lab_gestion-productos-seguridad
sonar.organization=bgrez-lab

# Fuentes a analizar (Python + plantillas).
sonar.sources=.
sonar.language=py
sonar.python.version=3

# Excluir todo lo que no es código fuente de la aplicación.
sonar.exclusions=**/.venv/**,**/.git/**,**/__pycache__/**,**/evidencia/**,**/.github/**

# Codificación
sonar.sourceEncoding=UTF-8